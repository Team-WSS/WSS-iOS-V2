name: Run Tests

on:
  pull_request:
    branches: [ develop ]
  issue_comment:
    types: [ created ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # 0) 트리거 확인 + .tests 선언 모듈 스캔
  discover:
    name: Discover Test Modules
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/domain-test'))
    outputs:
      modules_json: ${{ steps.set-matrix.outputs.modules_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.sha }}

      # 정식 모듈(Project.swift 보유) 중 targets에 .tests 를 선언한 것만 scheme로.
      # 폴더 ls 스캔이 아니라 Project.swift 기준이라, 레지스트리에 없는 유령 폴더
      # (rename/브랜치 잔재)는 Project.swift가 없어 자동으로 제외된다.
      - name: Build matrix from modules declaring .tests
        id: set-matrix
        run: |
          python3 - << 'PY'
          import os, json, re
          schemes = []
          for root, _dirs, files in os.walk("Projects"):
            if "Project.swift" not in files:
              continue
            with open(os.path.join(root, "Project.swift"), encoding="utf-8") as f:
              content = f.read()
            m = re.search(r'targets:\s*\[([^\]]*)\]', content, re.S)
            if m and '.tests' in m.group(1):
              schemes.append(os.path.basename(root))
          schemes = sorted(set(schemes))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write("modules_json=" + json.dumps(schemes) + "\n")
          PY

      - name: Print discovered modules
        run: echo '${{ steps.set-matrix.outputs.modules_json }}'

  # 1) 모듈별 테스트 (병렬)
  test:
    name: Test ${{ matrix.module }}
    runs-on: macos-15
    needs: discover
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules_json) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.sha }}

      - name: Create placeholder xcconfig
        run: |
          mkdir -p Config
          cat > Config/Config_Shared.xcconfig << 'EOF'
          BUCKET_URL = https://placeholder
          KAKAO_APP_KEY = placeholder
          APPSTORE_ID = placeholder
          EOF
          cat > Config/Config_Debug.xcconfig << 'EOF'
          #include "./Config_Shared.xcconfig"
          BASE_URL = https://placeholder
          TEST_API_KEY = placeholder
          EOF
          cat > Config/Config_Release.xcconfig << 'EOF'
          #include "./Config_Shared.xcconfig"
          BASE_URL = https://placeholder
          AMPLITUDE_API_KEY = placeholder
          EOF

      - name: Setup mise & install tools
        uses: jdx/mise-action@v2

      - name: Cache Tuist
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/com.tuist.Tuist
            Tuist/.build
          key: tuist-${{ runner.os }}-${{ hashFiles('Tuist/Package.swift', 'Tuist/Package.resolved') }}
          restore-keys: |
            tuist-${{ runner.os }}-

      - name: Generate project
        run: |
          tuist install
          tuist generate --no-open

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('**/*.swift', '**/Project.swift') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Boot iOS Simulator
        run: |
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime in sorted(data['devices'].keys(), reverse=True):
              if 'iOS' in runtime:
                  for dev in data['devices'][runtime]:
                      if dev.get('isAvailable') and 'iPhone' in dev['name']:
                          print(dev['udid'])
                          exit(0)
          ")
          echo "SIM_UDID=$SIM_UDID" >> $GITHUB_ENV
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true

      - name: Run ${{ matrix.module }} Tests
        run: |
          set -o pipefail
          mkdir -p TestResults

          xcodebuild test \
            -workspace WSS-iOS-V2.xcworkspace \
            -scheme ${{ matrix.module }} \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults/${{ matrix.module }}.xcresult \
          | xcbeautify --renderer github-actions

      - name: Generate per-module coverage snippet
        if: always()
        run: |
          set -euo pipefail
          MODULE="${{ matrix.module }}"
          RESULT_PATH="TestResults/${MODULE}.xcresult"

          mkdir -p CoverageParts

          cat > /tmp/parse_cov.py << 'PY'
          import sys, json
          data = json.load(sys.stdin)
          module = sys.argv[1]
          for t in data.get('targets', []):
              name = t.get('name', '')
              if module in name and 'Tests' not in name:
                  print(f"{t.get('lineCoverage', 0) * 100:.1f}%")
                  sys.exit(0)
          print('N/A')
          PY

          if [ -d "$RESULT_PATH" ]; then
            COV_JSON=$(xcrun xccov view --report --json "$RESULT_PATH" 2>/dev/null || echo "")
            if [ -n "$COV_JSON" ]; then
              PERCENT=$(echo "$COV_JSON" | python3 /tmp/parse_cov.py "$MODULE")
              echo "${MODULE}|${PERCENT}" > "CoverageParts/${MODULE}.txt"
            else
              echo "${MODULE}|⚠️ Report unavailable" > "CoverageParts/${MODULE}.txt"
            fi
          else
            echo "${MODULE}|❌ Test failed" > "CoverageParts/${MODULE}.txt"
          fi

      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ matrix.module }}
          path: TestResults/${{ matrix.module }}.xcresult
          retention-days: 7

      - name: Upload coverage part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-part-${{ matrix.module }}
          path: CoverageParts/${{ matrix.module }}.txt
          retention-days: 7

  # 2) 모든 모듈 결과를 모아서 PR 코멘트 + Summary 작성
  report:
    name: Report Coverage (All Modules)
    runs-on: ubuntu-latest
    needs: [discover, test]
    if: always() && needs.discover.result != 'skipped'
    steps:
      - name: Download all coverage parts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-part-*
          path: coverage_parts
          merge-multiple: true

      - name: Build coverage.md
        run: |
          set -euo pipefail

          echo "## 테스트 커버리지 리포트" > coverage.md
          echo "" >> coverage.md
          echo "| Module | Coverage |" >> coverage.md
          echo "|--------|----------|" >> coverage.md

          python3 - << 'PY'
          import json, os
          modules = json.loads(r'''${{ needs.discover.outputs.modules_json }}''')
          lines = []
          for d in modules:
            p = os.path.join("coverage_parts", f"{d}.txt")
            if os.path.exists(p):
              with open(p, "r", encoding="utf-8") as f:
                raw = f.read().strip()
              module, cov = raw.split("|", 1) if "|" in raw else (d, "N/A")
              lines.append((module, cov))
            else:
              lines.append((d, "⚠️ Missing coverage"))
          with open("coverage.md", "a", encoding="utf-8") as out:
            for m, c in lines:
              out.write(f"| {m} | {c} |\n")
          PY

          echo "" >> coverage.md
          echo "<sub>Generated by CI on $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')</sub>" >> coverage.md

          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post coverage comment on PR
        if: github.event.pull_request.number != '' || github.event.issue.number != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ github.event.pull_request.number || github.event.issue.number }}
          path: coverage.md

  # 3) 자동 CI(PR)의 단일 통과 게이트 — 이 job 이름을 develop 브랜치 보호의 "필수 통과 체크"로 건다.
  #    matrix가 늘어도 required check는 이 job 하나만 유지하면 된다.
  gate:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [discover, test]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Verify all module tests passed
        run: |
          echo "discover: ${{ needs.discover.result }}"
          echo "test:     ${{ needs.test.result }}"
          if [ "${{ needs.discover.result }}" != "success" ]; then
            echo "::error::모듈 탐색(discover)이 실패했습니다."
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::일부 모듈 테스트가 실패했습니다. 위 Test 매트릭스에서 빨간 job을 확인하세요."
            exit 1
          fi
          echo "✅ 모든 모듈 테스트 통과"

  # 4) 아키텍처 규칙 검사(A2) — 자체 SwiftSyntax 검사기(Tooling/ArchLint).
  #    ubuntu + 공식 swift 컨테이너로 Xcode 없이 빠르게 돈다.
  #    error(규칙① VM 계약)면 실패, warning(규칙⑤ Service 분기)은 리포트만.
  #    이 job 이름("Architecture Rules")을 develop 보호의 필수 통과 체크로 건다
  #    (단일 job이라 test 매트릭스의 gate 같은 래퍼가 필요 없다).
  arch-lint:
    name: Architecture Rules
    runs-on: ubuntu-latest
    container: swift:6.3.3
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ArchLint build
        uses: actions/cache@v4
        with:
          path: Tooling/ArchLint/.build
          key: archlint-${{ runner.os }}-${{ hashFiles('Tooling/ArchLint/Package.resolved', 'Tooling/ArchLint/Sources/**') }}
          restore-keys: |
            archlint-${{ runner.os }}-

      # GITHUB_ACTIONS 환경변수는 러너가 자동 세팅 → 도구가 ::error/::warning 주석을
      # emit 해 위반이 PR diff에 인라인으로 붙는다. error가 있으면 종료코드 1로 job 실패.
      - name: Run ArchLint
        run: swift run --package-path Tooling/ArchLint ArchLint .
