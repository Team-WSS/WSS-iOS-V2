name: Run Tests

on:
  pull_request:
    branches: [ develop ]
  issue_comment:
    types: [ created ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # 0) 트리거 확인 + .tests 선언 모듈 스캔
  discover:
    name: Discover Test Modules
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/domain-test'))
    outputs:
      modules_json: ${{ steps.set-matrix.outputs.modules_json }}
    steps:
      # 선택적 테스트의 git diff(merge-base..HEAD)를 위해 PR head + 전체 히스토리가 필요.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.event.pull_request.head.sha || github.sha }}

      - name: base 브랜치 fetch (PR diff 기준)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.ref }}

      # 선택적 테스트: 변경 파일 → 변경 모듈 → 의존 역그래프로 영향 모듈 계산 → .tests 선언 모듈과 교집합.
      #   전체 실행 폴백: workflow_dispatch·/domain-test 코멘트·인프라 변경·diff/계산 실패(fail-loud).
      #   모듈 목록은 폴더 ls가 아니라 Project.swift 보유 기준 → 레지스트리 밖 유령 폴더는 자동 제외.
      #   그래프는 각 Project.swift의 `.module(.<layer>(.<case>))` 선언을 파싱해 만든다(Tuist 불필요).
      - name: Select test modules (diff-aware)
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'develop' }}
          RUN_ALL: ${{ github.event_name == 'issue_comment' && 'true' || 'false' }}
        run: |
          python3 - << 'PY'
          import os, json, re, subprocess, sys

          EVENT = os.environ.get("EVENT_NAME", "")
          BASE = os.environ.get("BASE_REF", "develop")
          RUN_ALL = os.environ.get("RUN_ALL", "false") == "true"

          # .tests 타깃을 선언한 정식 모듈(Project.swift 보유)만 후보. 유령 폴더는 Project.swift가 없어 제외.
          def modules_with_tests():
              res = []
              for root, _d, files in os.walk("Projects"):
                  if "Project.swift" not in files:
                      continue
                  with open(os.path.join(root, "Project.swift"), encoding="utf-8") as f:
                      c = f.read()
                  m = re.search(r'targets:\s*\[([^\]]*)\]', c, re.S)
                  if m and '.tests' in m.group(1):
                      res.append(os.path.basename(root))
              return sorted(set(res))

          TEST_MODULES = modules_with_tests()

          def emit(modules, reason):
              sel = sorted(set(modules) & set(TEST_MODULES))
              print(f"::notice::[선택적 테스트] {reason} → {len(sel)}개 모듈")
              print("실행 모듈:", sel)
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("modules_json=" + json.dumps(sel) + "\n")
              summ = os.environ.get("GITHUB_STEP_SUMMARY")
              if summ:
                  with open(summ, "a") as f:
                      f.write("### 선택적 테스트\n")
                      f.write(f"- 사유: {reason}\n")
                      f.write(f"- 실행 모듈({len(sel)}): {', '.join(sel) if sel else '(없음 — 테스트 스킵)'}\n")
              sys.exit(0)

          try:
              # 전체 실행 폴백(수동 트리거).
              if EVENT == "workflow_dispatch" or RUN_ALL:
                  emit(TEST_MODULES, f"{EVENT} (수동 전체 실행)")

              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", f"origin/{BASE}...HEAD"], text=True
              ).splitlines()
              changed = [c for c in changed if c.strip()]
              print(f"변경 파일 {len(changed)}건")
              for c in changed[:50]:
                  print("  ", c)

              # 인프라/빌드시스템 변경 → 전 모듈(그래프 전체가 흔들릴 수 있음).
              # Plugins/ 전체(DependencyPlugin·ConfigurationPlugin·EnvironmentPlugin 등)·Tuist·워크플로우·
              # Config(xcconfig)는 그래프/빌드 전반을 흔들 수 있어 변경 시 전체 실행.
              INFRA_PREFIX = ("Plugins/", "Tuist/", ".github/workflows/", "Config/")
              INFRA_EXACT = {"Workspace.swift", "mise.toml", ".mise.toml", "Package.swift", "Package.resolved"}
              infra = [c for c in changed if c.startswith(INFRA_PREFIX) or c in INFRA_EXACT]
              if infra:
                  emit(TEST_MODULES, f"인프라/빌드시스템 변경 {infra[:3]}")

              # 의존 그래프: Project.swift의 .module(.<layer>(.<case>)) → dependee 모듈명(ModuleType 네이밍 재현).
              def pascal(s):
                  spaced = re.sub(r'([a-z0-9])([A-Z])', r'\1 \2', s)
                  return ''.join(w[:1].upper() + w[1:] for w in spaced.split())
              SUFFIX = {"feature": "Feature", "domain": "Domain", "data": "Data", "core": "", "ui": ""}
              UI_SPECIAL = {"wssComponent": "WSSComponent", "designSystem": "DesignSystem"}
              def resolve(layer, case):
                  if layer == "ui" and case in UI_SPECIAL:
                      return UI_SPECIAL[case]
                  return pascal(case) + SUFFIX.get(layer, "")
              DEP_RE = re.compile(r'\.module\(\s*\.(feature|domain|data|core|ui)\(\s*\.(\w+)\s*\)')

              # 정식 모듈 디렉토리(Project.swift 보유)와 의존 그래프를 한 번의 walk로 만든다.
              # module_dirs 키는 상대경로 dir → 모듈명. App(Projects/App)처럼 <Layer>/<Module> 2단이
              # 아닌 특수 구조도 이걸로 일관 처리(경로 접두 매칭).
              module_dirs = {}
              deps = {}
              for root, _d, files in os.walk("Projects"):
                  if "Project.swift" not in files:
                      continue
                  name = os.path.basename(root)
                  module_dirs[root] = name
                  with open(os.path.join(root, "Project.swift"), encoding="utf-8") as f:
                      c = f.read()
                  deps[name] = {resolve(l, cs) for (l, cs) in DEP_RE.findall(c)}

              known = set(module_dirs.values())
              # drift 방어: .module() 의존 대상이 실제 모듈 집합에 없으면 그래프를 믿을 수 없다(ModuleType
              # 네이밍 예외·파서 drift) → 조용히 dependents를 놓쳐 거짓 초록을 내느니 안전하게 전체 실행.
              unknown = sorted({d for dd in deps.values() for d in dd if d not in known})
              if unknown:
                  emit(TEST_MODULES, f"의존 그래프 drift(미확인 모듈 {unknown[:3]}) → 안전하게 전체 실행")

              # 변경 파일 → 변경 모듈: 파일의 접두가 되는 module dir 중 가장 긴 것(App 등 특수구조 포함).
              def module_of(p):
                  best = None
                  for d in module_dirs:
                      if p == d or p.startswith(d + "/"):
                          if best is None or len(d) > len(best):
                              best = d
                  return module_dirs.get(best)

              changed_modules = set(filter(None, (module_of(c) for c in changed)))
              print("변경 모듈:", sorted(changed_modules))

              # 역그래프: 누가 나를 의존하나.
              dependents = {}
              for mod, dd in deps.items():
                  for d in dd:
                      dependents.setdefault(d, set()).add(mod)

              # 영향 모듈 = 변경 모듈 ∪ 전이적 dependents.
              affected = set(changed_modules)
              queue = list(changed_modules)
              while queue:
                  cur = queue.pop()
                  for dep in dependents.get(cur, ()):
                      if dep not in affected:
                          affected.add(dep)
                          queue.append(dep)

              print("영향 모듈(변경+의존자):", sorted(affected))
              emit(affected, f"변경 모듈 {sorted(changed_modules) or '없음'} + 의존자")
          except SystemExit:
              raise
          except Exception as e:
              emit(TEST_MODULES, f"선택 계산 실패({e!r}) → 안전하게 전체 실행")
          PY

      - name: Print discovered modules
        run: echo '${{ steps.set-matrix.outputs.modules_json }}'

  # 1) 모듈별 테스트 (병렬)
  test:
    name: Test ${{ matrix.module }}
    runs-on: macos-15
    needs: discover
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules_json) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.sha }}

      - name: Create placeholder xcconfig
        run: |
          mkdir -p Config
          cat > Config/Config_Shared.xcconfig << 'EOF'
          BUCKET_URL = https://placeholder
          KAKAO_APP_KEY = placeholder
          APPSTORE_ID = placeholder
          EOF
          cat > Config/Config_Debug.xcconfig << 'EOF'
          #include "./Config_Shared.xcconfig"
          BASE_URL = https://placeholder
          TEST_API_KEY = placeholder
          EOF
          cat > Config/Config_Release.xcconfig << 'EOF'
          #include "./Config_Shared.xcconfig"
          BASE_URL = https://placeholder
          AMPLITUDE_API_KEY = placeholder
          EOF

      - name: Setup mise & install tools
        uses: jdx/mise-action@v2

      - name: Cache Tuist
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/com.tuist.Tuist
            Tuist/.build
          key: tuist-${{ runner.os }}-${{ hashFiles('Tuist/Package.swift', 'Tuist/Package.resolved') }}
          restore-keys: |
            tuist-${{ runner.os }}-

      - name: Generate project
        run: |
          tuist install
          tuist generate --no-open

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('**/*.swift', '**/Project.swift') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Boot iOS Simulator
        run: |
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime in sorted(data['devices'].keys(), reverse=True):
              if 'iOS' in runtime:
                  for dev in data['devices'][runtime]:
                      if dev.get('isAvailable') and 'iPhone' in dev['name']:
                          print(dev['udid'])
                          exit(0)
          ")
          echo "SIM_UDID=$SIM_UDID" >> $GITHUB_ENV
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true

      - name: Run ${{ matrix.module }} Tests
        run: |
          set -o pipefail
          mkdir -p TestResults

          xcodebuild test \
            -workspace WSS-iOS-V2.xcworkspace \
            -scheme ${{ matrix.module }} \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults/${{ matrix.module }}.xcresult \
          | xcbeautify --renderer github-actions

      - name: Generate per-module coverage snippet
        if: always()
        run: |
          set -euo pipefail
          MODULE="${{ matrix.module }}"
          RESULT_PATH="TestResults/${MODULE}.xcresult"

          mkdir -p CoverageParts

          cat > /tmp/parse_cov.py << 'PY'
          import sys, json
          data = json.load(sys.stdin)
          module = sys.argv[1]
          for t in data.get('targets', []):
              name = t.get('name', '')
              if module in name and 'Tests' not in name:
                  print(f"{t.get('lineCoverage', 0) * 100:.1f}%")
                  sys.exit(0)
          print('N/A')
          PY

          if [ -d "$RESULT_PATH" ]; then
            COV_JSON=$(xcrun xccov view --report --json "$RESULT_PATH" 2>/dev/null || echo "")
            if [ -n "$COV_JSON" ]; then
              PERCENT=$(echo "$COV_JSON" | python3 /tmp/parse_cov.py "$MODULE")
              echo "${MODULE}|${PERCENT}" > "CoverageParts/${MODULE}.txt"
            else
              echo "${MODULE}|⚠️ Report unavailable" > "CoverageParts/${MODULE}.txt"
            fi
          else
            echo "${MODULE}|❌ Test failed" > "CoverageParts/${MODULE}.txt"
          fi

      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ matrix.module }}
          path: TestResults/${{ matrix.module }}.xcresult
          retention-days: 7

      - name: Upload coverage part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-part-${{ matrix.module }}
          path: CoverageParts/${{ matrix.module }}.txt
          retention-days: 7

  # 2) 모든 모듈 결과를 모아서 PR 코멘트 + Summary 작성
  report:
    name: Report Coverage (All Modules)
    runs-on: ubuntu-latest
    needs: [discover, test]
    if: always() && needs.discover.result != 'skipped'
    steps:
      - name: Download all coverage parts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-part-*
          path: coverage_parts
          merge-multiple: true

      - name: Build coverage.md
        run: |
          set -euo pipefail

          echo "## 테스트 커버리지 리포트" > coverage.md
          echo "" >> coverage.md
          echo "| Module | Coverage |" >> coverage.md
          echo "|--------|----------|" >> coverage.md

          python3 - << 'PY'
          import json, os
          modules = json.loads(r'''${{ needs.discover.outputs.modules_json }}''')
          lines = []
          for d in modules:
            p = os.path.join("coverage_parts", f"{d}.txt")
            if os.path.exists(p):
              with open(p, "r", encoding="utf-8") as f:
                raw = f.read().strip()
              module, cov = raw.split("|", 1) if "|" in raw else (d, "N/A")
              lines.append((module, cov))
            else:
              lines.append((d, "⚠️ Missing coverage"))
          with open("coverage.md", "a", encoding="utf-8") as out:
            for m, c in lines:
              out.write(f"| {m} | {c} |\n")
          PY

          echo "" >> coverage.md
          echo "<sub>Generated by CI on $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')</sub>" >> coverage.md

          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post coverage comment on PR
        if: github.event.pull_request.number != '' || github.event.issue.number != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ github.event.pull_request.number || github.event.issue.number }}
          path: coverage.md

  # 3) 자동 CI(PR)의 단일 통과 게이트 — 이 job 이름을 develop 브랜치 보호의 "필수 통과 체크"로 건다.
  #    matrix가 늘어도 required check는 이 job 하나만 유지하면 된다.
  gate:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [discover, test]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Verify all module tests passed
        run: |
          echo "discover: ${{ needs.discover.result }}"
          echo "test:     ${{ needs.test.result }}"
          if [ "${{ needs.discover.result }}" != "success" ]; then
            echo "::error::모듈 탐색(discover)이 실패했습니다."
            exit 1
          fi
          # 선택적 테스트로 영향 모듈이 없으면 매트릭스가 비어 test job이 'skipped' → 정상 통과로 본다.
          # (discover가 success인 한 skipped는 "빈 매트릭스"뿐 — 실패면 아래 *)로 떨어진다.)
          case "${{ needs.test.result }}" in
            success)  echo "✅ 모든 영향 모듈 테스트 통과" ;;
            skipped)  echo "✅ 영향받는 테스트 모듈 없음(선택적 테스트) — 통과" ;;
            *)        echo "::error::일부 모듈 테스트가 실패했습니다. 위 Test 매트릭스에서 빨간 job을 확인하세요."
                      exit 1 ;;
          esac

  # 4) 아키텍처 규칙 검사(A2) — 자체 SwiftSyntax 검사기(Tooling/ArchLint).
  #    ubuntu + 공식 swift 컨테이너로 Xcode 없이 빠르게 돈다.
  #    error(규칙① VM 계약)면 실패, warning(규칙⑤ Service 분기)은 리포트만.
  #    이 job 이름("Architecture Rules")을 develop 보호의 필수 통과 체크로 건다
  #    (단일 job이라 test 매트릭스의 gate 같은 래퍼가 필요 없다).
  arch-lint:
    name: Architecture Rules
    runs-on: ubuntu-latest
    container: swift:6.3.3
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ArchLint build
        uses: actions/cache@v4
        with:
          path: Tooling/ArchLint/.build
          key: archlint-${{ runner.os }}-${{ hashFiles('Tooling/ArchLint/Package.resolved', 'Tooling/ArchLint/Sources/**') }}
          restore-keys: |
            archlint-${{ runner.os }}-

      # 규칙을 돌리기 전에, 규칙 자체가 제대로 작동하는지부터 검증한다(회귀 그물).
      # 누가 규칙 코드를 건드려 감지가 깨지면 여기서 먼저 빨간불이 뜬다.
      - name: ArchLint 자체 테스트
        run: swift test --package-path Tooling/ArchLint

      # GITHUB_ACTIONS 환경변수는 러너가 자동 세팅 → 도구가 ::error/::warning 주석을
      # emit 해 위반이 PR diff에 인라인으로 붙는다. error가 있으면 종료코드 1로 job 실패.
      - name: Run ArchLint
        run: swift run --package-path Tooling/ArchLint ArchLint .

  # 5) 스타일 검사(A3) — Apple swift-format. arch-lint와 같은 swift 컨테이너에서 Xcode 없이 돈다.
  #    swift-format은 Swift 툴체인 번들이라 별도 설치가 없다(첫 스텝 `swift format --version`이
  #    이 전제를 검증 — 없으면 여기서 빨간불로 폴백 신호).
  #    "변경된 .swift 파일만" 린트한다(레거시 백로그 제외) — 그 이유와 설정은
  #    Tooling/SwiftFormat/lint-changed.sh 주석 참고. 스타일 규칙은 루트 .swift-format.
  #    ⚠️ 아직 report-only(위반 출력만, 실패 안 시킴). develop 초록 확인 후 스크립트에
  #    --strict를 붙여 하드 게이트로 승격하고, 이 job 이름("Swift Format")을 develop
  #    보호의 필수 통과 체크로 건다(arch-lint와 동일한 승격 순서).
  format-lint:
    name: Swift Format
    runs-on: ubuntu-latest
    container: swift:6.3.3
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      # 3-dot diff(merge-base..HEAD)로 PR 자기 변경만 보려면 PR head + 전체 히스토리가 필요.
      - name: Checkout (PR head, 전체 히스토리)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: safe.directory (컨테이너 소유권 경고 회피)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: base 브랜치 fetch (diff 기준)
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.ref || 'develop' }}

      # 전제 검증: 이 컨테이너에 swift-format이 실제로 있는지. 없으면 job 실패 → 폴백 신호.
      - name: swift format 전제 검증
        run: swift format --version

      - name: 변경 .swift 파일 lint (report-only)
        run: bash Tooling/SwiftFormat/lint-changed.sh --base "origin/${{ github.event.pull_request.base.ref || 'develop' }}"
